name: Auto Update Index

on:
  push:
    branches: [main]

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate index.html
        run: |
          # 生成文件列表的 JavaScript 数组内容（不包含外层方括号）
          FILES_ARRAY=""
          FIRST=true
          for f in *.html; do
            [ "$f" = "index.html" ] && continue
            [ "$f" = "index-template.html" ] && continue
            if [ "$FIRST" = true ]; then
              FILES_ARRAY="\"$f\""
              FIRST=false
            else
              FILES_ARRAY="${FILES_ARRAY}, \"$f\""
            fi
          done

          # 读取模板并替换占位符
          sed "s|// PLACEHOLDER_FILES|$FILES_ARRAY|g" index-template.html > index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Auto update index.html"
          git push
