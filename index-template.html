<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章列表</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 {
      font-size: 1.5em;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }
    .config-section {
      background: #f6f8fa;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .config-section input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #d0d7de;
      border-radius: 4px;
      font-family: monospace;
    }
    .config-section button {
      margin-top: 10px;
      padding: 8px 16px;
      background: #2da44e;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .config-section button:hover {
      background: #2c974b;
    }
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      display: none;
    }
    .status.success {
      background: #dafbe1;
      color: #1a7f37;
      display: block;
    }
    .status.error {
      background: #ffebe9;
      color: #cf222e;
      display: block;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    .file-item {
      margin: 20px 0;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 12px;
      background: #ffffff;
    }
    .file-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    a {
      text-decoration: none;
      color: #0969da;
      font-size: 1.1em;
      flex: 1;
    }
    a:hover {
      text-decoration: underline;
    }
    .preview-btn {
      padding: 4px 12px;
      background: #0969da;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
    }
    .preview-btn:hover {
      background: #0550ae;
    }
    .edit-btn {
      padding: 4px 12px;
      background: #6e7781;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
    }
    .edit-btn:hover {
      background: #57606a;
    }
    .edit-btn:disabled {
      background: #8c959f;
      cursor: not-allowed;
    }
    .delete-btn {
      padding: 4px 12px;
      background: #cf222e;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
    }
    .delete-btn:hover {
      background: #a40e26;
    }
    .delete-btn:disabled {
      background: #6e7781;
      cursor: not-allowed;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: white;
      border-radius: 8px;
      width: 90%;
      max-width: 1200px;
      height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #d0d7de;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.1em;
      font-weight: 600;
      color: #24292f;
      margin: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      color: #57606a;
      cursor: pointer;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }
    .modal-close:hover {
      background: #f6f8fa;
      color: #24292f;
    }
    .modal-body {
      flex: 1;
      padding: 20px;
      overflow: hidden;
    }
    .preview-frame {
      width: 100%;
      height: 100%;
      border: 1px solid #d0d7de;
      border-radius: 4px;
      background: #f6f8fa;
    }
    .help-text {
      font-size: 0.9em;
      color: #57606a;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h1>📄 文章列表</h1>

  <div class="config-section">
    <label for="github-token">
      <strong>GitHub Personal Access Token</strong>
      <div class="help-text">
        需要 <code>repo</code> 权限。创建 Token:
        <a href="https://github.com/settings/tokens/new?scopes=repo&description=Web-Archives-Manager" target="_blank">点击这里</a>
      </div>
    </label>
    <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx">
    <button onclick="saveToken()">保存 Token</button>
    <div id="token-status" class="status"></div>
  </div>

  <ul id="file-list">
    <!-- 文件列表将由 JavaScript 生成 -->
  </ul>

  <!-- 预览模态框 -->
  <div id="preview-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">预览</h2>
        <button class="modal-close" onclick="closePreview()">&times;</button>
      </div>
      <div class="modal-body">
        <iframe id="preview-frame" class="preview-frame"></iframe>
      </div>
    </div>
  </div>

  <script>
    // GitHub 仓库配置
    const REPO_OWNER = 'blurmood';
    const REPO_NAME = 'Web-Archives';
    const BRANCH = 'main';

    // 从 localStorage 加载 token
    let githubToken = localStorage.getItem('github_token') || '';
    if (githubToken) {
      document.getElementById('github-token').value = githubToken;
      showStatus('token-status', 'Token 已加载', 'success');
    }

    // 文件列表数据（由 GitHub Actions 生成时填充）
    const files = [
      // PLACEHOLDER_FILES
    ];

    // 保存 Token
    function saveToken() {
      const token = document.getElementById('github-token').value.trim();
      if (!token) {
        showStatus('token-status', '请输入有效的 Token', 'error');
        return;
      }
      localStorage.setItem('github_token', token);
      githubToken = token;
      showStatus('token-status', 'Token 已保存', 'success');
    }

    // 显示状态消息
    function showStatus(elementId, message, type) {
      const statusEl = document.getElementById(elementId);
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
      setTimeout(() => {
        statusEl.style.display = 'none';
      }, 3000);
    }

    // 渲染文件列表
    function renderFileList() {
      const listEl = document.getElementById('file-list');
      listEl.innerHTML = files.map((filename, index) => `
        <li class="file-item">
          <div class="file-header">
            <a href="${filename}" target="_blank" id="link-${index}">${filename}</a>
            <button class="preview-btn" onclick="openPreview('${filename}')">
              预览
            </button>
            <button class="edit-btn" onclick="editFilename(${index}, '${filename}')" ${!githubToken ? 'disabled' : ''}>
              编辑
            </button>
            <button class="delete-btn" onclick="deleteFile('${filename}')" ${!githubToken ? 'disabled' : ''}>
              删除
            </button>
          </div>
        </li>
      `).join('');
    }

    // 打开预览模态框
    function openPreview(filename) {
      const modal = document.getElementById('preview-modal');
      const frame = document.getElementById('preview-frame');
      const title = document.getElementById('modal-title');

      title.textContent = filename;
      frame.src = filename;
      modal.classList.add('active');

      // 点击模态框背景关闭
      modal.onclick = function(e) {
        if (e.target === modal) {
          closePreview();
        }
      };
    }

    // 关闭预览模态框
    function closePreview() {
      const modal = document.getElementById('preview-modal');
      modal.classList.remove('active');
    }

    // ESC 键关闭模态框
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closePreview();
      }
    });

    // 编辑文件名（使用 Git Tree API 在单个 commit 中完成重命名）
    async function editFilename(index, oldFilename) {
      if (!githubToken) {
        alert('请先配置 GitHub Token');
        return;
      }

      const newFilename = prompt('输入新的文件名:', oldFilename);

      if (!newFilename || newFilename === oldFilename) {
        return;
      }

      if (!newFilename.endsWith('.html')) {
        alert('文件名必须以 .html 结尾');
        return;
      }

      try {
        // 禁用所有按钮
        document.querySelectorAll('.edit-btn, .delete-btn').forEach(btn => btn.disabled = true);

        // 1. 获取当前分支的最新 commit
        const refUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/refs/heads/${BRANCH}`;
        const refResponse = await fetch(refUrl, {
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!refResponse.ok) {
          throw new Error('获取分支信息失败');
        }

        const refData = await refResponse.json();
        const latestCommitSha = refData.object.sha;

        // 2. 获取文件内容
        const fileUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${encodeURIComponent(oldFilename)}`;
        const fileResponse = await fetch(fileUrl, {
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!fileResponse.ok) {
          throw new Error('获取文件内容失败');
        }

        const fileData = await fileResponse.json();

        // 3. 创建新的 blob（使用旧文件的内容）
        const blobUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/blobs`;
        const blobResponse = await fetch(blobUrl, {
          method: 'POST',
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            content: fileData.content,
            encoding: 'base64'
          })
        });

        if (!blobResponse.ok) {
          throw new Error('创建 blob 失败');
        }

        const blobData = await blobResponse.json();

        // 4. 获取当前 commit 的 tree
        const commitUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/commits/${latestCommitSha}`;
        const commitResponse = await fetch(commitUrl, {
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!commitResponse.ok) {
          throw new Error('获取 commit 信息失败');
        }

        const commitData = await commitResponse.json();
        const baseTreeSha = commitData.tree.sha;

        // 5. 创建新的 tree（删除旧文件，添加新文件）
        const treeUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees`;
        const treeResponse = await fetch(treeUrl, {
          method: 'POST',
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            base_tree: baseTreeSha,
            tree: [
              {
                path: oldFilename,
                mode: '100644',
                type: 'blob',
                sha: null  // null 表示删除
              },
              {
                path: newFilename,
                mode: '100644',
                type: 'blob',
                sha: blobData.sha
              }
            ]
          })
        });

        if (!treeResponse.ok) {
          const error = await treeResponse.json();
          throw new Error(error.message || '创建 tree 失败');
        }

        const treeData = await treeResponse.json();

        // 6. 创建新的 commit
        const newCommitUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/commits`;
        const newCommitResponse = await fetch(newCommitUrl, {
          method: 'POST',
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Rename ${oldFilename} to ${newFilename}`,
            tree: treeData.sha,
            parents: [latestCommitSha]
          })
        });

        if (!newCommitResponse.ok) {
          throw new Error('创建 commit 失败');
        }

        const newCommitData = await newCommitResponse.json();

        // 7. 更新分支引用
        const updateRefUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/refs/heads/${BRANCH}`;
        const updateRefResponse = await fetch(updateRefUrl, {
          method: 'PATCH',
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            sha: newCommitData.sha
          })
        });

        if (!updateRefResponse.ok) {
          throw new Error('更新分支引用失败');
        }

        // 更新文件列表
        files[index] = newFilename;
        renderFileList();

        alert(`文件已重命名为 "${newFilename}"`);

      } catch (error) {
        alert(`重命名失败: ${error.message}`);
        // 重新启用按钮
        document.querySelectorAll('.edit-btn, .delete-btn').forEach(btn => btn.disabled = false);
      }
    }

    // 获取文件的 SHA
    async function getFileSHA(filename) {
      const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${encodeURIComponent(filename)}`;

      console.log('请求 URL:', url);

      const response = await fetch(url, {
        headers: {
          'Authorization': `token ${githubToken}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });

      if (!response.ok) {
        let errorMsg = `HTTP ${response.status} ${response.statusText}`;
        try {
          const errorData = await response.json();
          if (errorData.message) {
            errorMsg += `: ${errorData.message}`;
          }
        } catch (e) {
          // 无法解析错误响应
        }
        throw new Error(`获取文件信息失败: ${errorMsg}`);
      }

      const data = await response.json();
      return data.sha;
    }

    // 删除文件
    async function deleteFile(filename) {
      if (!githubToken) {
        alert('请先配置 GitHub Token');
        return;
      }

      if (!confirm(`确定要删除 "${filename}" 吗？此操作不可撤销。`)) {
        return;
      }

      try {
        // 禁用所有删除按钮
        document.querySelectorAll('.delete-btn').forEach(btn => btn.disabled = true);

        // 获取文件 SHA
        const sha = await getFileSHA(filename);

        // 删除文件
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${encodeURIComponent(filename)}`;
        const response = await fetch(url, {
          method: 'DELETE',
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Delete ${filename}`,
            sha: sha,
            branch: BRANCH
          })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message || '删除失败');
        }

        // 从文件列表中移除该文件
        const index = files.indexOf(filename);
        if (index > -1) {
          files.splice(index, 1);
        }

        // 重新渲染列表
        renderFileList();

        alert(`文件 "${filename}" 已删除。`);

      } catch (error) {
        alert(`删除失败: ${error.message}`);
        // 重新启用删除按钮
        document.querySelectorAll('.delete-btn').forEach(btn => btn.disabled = false);
      }
    }

    // 初始化页面
    renderFileList();
  </script>
</body>
</html>
