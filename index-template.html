<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>归档</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #FAFAF8;
      --bg-secondary: #F5F5F3;
      --text-primary: #1A1A1A;
      --text-secondary: #6B6B6B;
      --text-tertiary: #9A9A9A;
      --accent: #2C5F2D;
      --accent-hover: #234A24;
      --border: #E8E8E6;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Spectral', serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 40px;
    }

    header {
      margin-bottom: 80px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-tertiary);
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    .config-section {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 32px;
      margin-bottom: 64px;
      transition: box-shadow 0.3s ease;
    }

    .config-section:hover {
      box-shadow: var(--shadow-sm);
    }

    .config-label {
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 16px;
      display: block;
    }

    .help-text {
      font-size: 0.875rem;
      color: var(--text-tertiary);
      margin-top: 8px;
      line-height: 1.5;
    }

    .help-text a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
    }

    .help-text a:hover {
      border-bottom-color: var(--accent);
    }

    .config-section input {
      width: 100%;
      padding: 12px 16px;
      margin-top: 12px;
      border: 1px solid var(--border);
      background: var(--bg-primary);
      font-family: 'Courier New', monospace;
      font-size: 0.875rem;
      color: var(--text-primary);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .config-section input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(44, 95, 45, 0.1);
    }

    .button-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 20px;
    }

    .btn {
      padding: 10px 24px;
      background: var(--accent);
      color: var(--bg-primary);
      border: none;
      font-family: 'Spectral', serif;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--accent-hover);
      box-shadow: var(--shadow-md);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .status {
      padding: 8px 16px;
      font-size: 0.875rem;
      color: var(--text-secondary);
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .status.success {
      color: var(--accent);
      display: block;
      opacity: 1;
    }

    .status.error {
      color: #B91C1C;
      display: block;
      opacity: 1;
    }

    .archives-list {
      list-style: none;
    }

    .file-item {
      margin-bottom: 1px;
      background: var(--bg-primary);
      border-top: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .file-item:last-child {
      border-bottom: 1px solid var(--border);
    }

    .file-item:hover {
      background: var(--bg-secondary);
      box-shadow: var(--shadow-sm);
      transform: translateX(4px);
    }

    .file-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 24px;
    }

    .file-link {
      flex: 1;
      text-decoration: none;
      color: var(--text-primary);
      font-size: 1.125rem;
      font-weight: 400;
      transition: color 0.2s ease;
      cursor: pointer;
    }

    .file-link:hover {
      color: var(--accent);
    }

    .file-actions {
      display: flex;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .file-item:hover .file-actions {
      opacity: 1;
    }

    .btn-ghost {
      padding: 6px 16px;
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      font-family: 'Spectral', serif;
      font-size: 0.8125rem;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-ghost:hover {
      color: var(--text-primary);
      border-color: var(--text-secondary);
      background: var(--bg-primary);
    }

    .btn-ghost:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-ghost:disabled:hover {
      color: var(--text-secondary);
      border-color: var(--border);
      background: transparent;
    }

    .btn-ghost.danger:hover:not(:disabled) {
      color: #B91C1C;
      border-color: #B91C1C;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(26, 26, 26, 0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: var(--bg-primary);
      width: 90%;
      max-width: 1200px;
      height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      animation: modalSlideIn 0.3s ease;
    }

    @keyframes modalSlideIn {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal-header {
      padding: 32px 40px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 400;
      color: var(--text-primary);
      margin: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-right: 24px;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 28px;
      color: var(--text-tertiary);
      cursor: pointer;
      padding: 0;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      line-height: 1;
    }

    .modal-close:hover {
      color: var(--text-primary);
      transform: rotate(90deg);
    }

    .modal-body {
      flex: 1;
      padding: 0;
      overflow: hidden;
    }

    .preview-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--bg-primary);
    }

    @media (max-width: 768px) {
      .container {
        padding: 40px 24px;
      }

      h1 {
        font-size: 2rem;
      }

      .file-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .file-actions {
        opacity: 1;
        width: 100%;
        justify-content: flex-end;
      }

      .modal-content {
        width: 95%;
        height: 90vh;
      }

      .modal-header {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>归档</h1>
      <div class="subtitle">Web Archives Collection</div>
    </header>

    <div class="config-section">
      <label class="config-label" for="github-token">
        GitHub Access Token
      </label>
      <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx">
      <div class="help-text">
        需要 <code>repo</code> 权限。<a href="https://github.com/settings/tokens/new?scopes=repo&description=Web-Archives-Manager" target="_blank">创建 Token</a>
      </div>
      <div class="button-row">
        <button class="btn" onclick="saveToken()">保存</button>
        <div id="token-status" class="status"></div>
      </div>
    </div>

    <ul class="archives-list" id="file-list">
      <!-- 文件列表将由 JavaScript 生成 -->
    </ul>
  </div>

  <!-- 预览模态框 -->
  <div id="preview-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">预览</h2>
        <button class="modal-close" onclick="closePreview()">&times;</button>
      </div>
      <div class="modal-body">
        <iframe id="preview-frame" class="preview-frame"></iframe>
      </div>
    </div>
  </div>

  <script>
    // GitHub 仓库配置
    const REPO_OWNER = 'blurmood';
    const REPO_NAME = 'Web-Archives';
    const BRANCH = 'main';

    // 从 localStorage 加载 token
    let githubToken = localStorage.getItem('github_token') || '';
    if (githubToken) {
      document.getElementById('github-token').value = githubToken;
      showStatus('token-status', 'Token 已加载', 'success');
    }

    // 文件列表数据（由 GitHub Actions 生成时填充）
    let files = [
      // PLACEHOLDER_FILES
    ];

    // 从 GitHub API 获取实际的文件列表
    async function fetchActualFileList() {
      try {
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`;
        const response = await fetch(url, {
          headers: {
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!response.ok) {
          console.warn('无法获取文件列表，使用 HTML 中的数据');
          return;
        }

        const data = await response.json();
        const htmlFiles = data
          .filter(item => item.type === 'file' && item.name.endsWith('.html'))
          .filter(item => item.name !== 'index.html' && item.name !== 'index-template.html')
          .map(item => item.name);

        if (htmlFiles.length > 0) {
          files = htmlFiles;
          renderFileList();
          console.log('文件列表已从 GitHub API 同步');
        }
      } catch (error) {
        console.warn('获取文件列表失败，使用 HTML 中的数据:', error);
      }
    }

    // 保存 Token
    function saveToken() {
      const token = document.getElementById('github-token').value.trim();
      if (!token) {
        showStatus('token-status', '请输入有效的 Token', 'error');
        return;
      }
      localStorage.setItem('github_token', token);
      githubToken = token;
      showStatus('token-status', 'Token 已保存', 'success');
    }

    // 显示状态消息
    function showStatus(elementId, message, type) {
      const statusEl = document.getElementById(elementId);
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
      setTimeout(() => {
        statusEl.style.display = 'none';
      }, 3000);
    }

    // 渲染文件列表
    function renderFileList() {
      const listEl = document.getElementById('file-list');
      listEl.innerHTML = files.map((filename, index) => `
        <li class="file-item">
          <div class="file-header">
            <a class="file-link" onclick="openPreview('${filename}')" id="link-${index}">${filename}</a>
            <div class="file-actions">
              <button class="btn-ghost" onclick="window.open('${filename}', '_blank')">
                查看
              </button>
              <button class="btn-ghost" onclick="editFilename(${index}, '${filename}')" ${!githubToken ? 'disabled' : ''}>
                编辑
              </button>
              <button class="btn-ghost danger" onclick="deleteFile('${filename}')" ${!githubToken ? 'disabled' : ''}>
                删除
              </button>
            </div>
          </div>
        </li>
      `).join('');
    }

    // 打开预览模态框
    function openPreview(filename) {
      const modal = document.getElementById('preview-modal');
      const frame = document.getElementById('preview-frame');
      const title = document.getElementById('modal-title');

      title.textContent = filename;
      frame.src = filename;
      modal.classList.add('active');

      // 点击模态框背景关闭
      modal.onclick = function(e) {
        if (e.target === modal) {
          closePreview();
        }
      };
    }

    // 关闭预览模态框
    function closePreview() {
      const modal = document.getElementById('preview-modal');
      modal.classList.remove('active');
    }

    // ESC 键关闭模态框
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closePreview();
      }
    });

    // 编辑文件名（使用 Git Tree API 在单个 commit 中完成重命名）
    async function editFilename(index, oldFilename) {
      if (!githubToken) {
        alert('请先配置 GitHub Token');
        return;
      }

      const newFilename = prompt('输入新的文件名:', oldFilename);

      if (!newFilename || newFilename === oldFilename) {
        return;
      }

      if (!newFilename.endsWith('.html')) {
        alert('文件名必须以 .html 结尾');
        return;
      }

      // 【乐观更新】立即更新前端显示
      files[index] = newFilename;
      renderFileList();

      try {
        // 禁用所有按钮
        document.querySelectorAll('.edit-btn, .delete-btn').forEach(btn => btn.disabled = true);

        // 1. 获取当前分支的最新 commit
        const refUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/refs/heads/${BRANCH}`;
        const refResponse = await fetch(refUrl, {
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!refResponse.ok) {
          throw new Error('获取分支信息失败');
        }

        const refData = await refResponse.json();
        const latestCommitSha = refData.object.sha;

        // 2. 获取文件内容
        const fileUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${encodeURIComponent(oldFilename)}`;
        const fileResponse = await fetch(fileUrl, {
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!fileResponse.ok) {
          throw new Error('获取文件内容失败');
        }

        const fileData = await fileResponse.json();

        // 3. 创建新的 blob（使用旧文件的内容）
        const blobUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/blobs`;
        const blobResponse = await fetch(blobUrl, {
          method: 'POST',
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            content: fileData.content,
            encoding: 'base64'
          })
        });

        if (!blobResponse.ok) {
          throw new Error('创建 blob 失败');
        }

        const blobData = await blobResponse.json();

        // 4. 获取当前 commit 的 tree
        const commitUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/commits/${latestCommitSha}`;
        const commitResponse = await fetch(commitUrl, {
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!commitResponse.ok) {
          throw new Error('获取 commit 信息失败');
        }

        const commitData = await commitResponse.json();
        const baseTreeSha = commitData.tree.sha;

        // 5. 创建新的 tree（删除旧文件，添加新文件）
        const treeUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees`;
        const treeResponse = await fetch(treeUrl, {
          method: 'POST',
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            base_tree: baseTreeSha,
            tree: [
              {
                path: oldFilename,
                mode: '100644',
                type: 'blob',
                sha: null  // null 表示删除
              },
              {
                path: newFilename,
                mode: '100644',
                type: 'blob',
                sha: blobData.sha
              }
            ]
          })
        });

        if (!treeResponse.ok) {
          const error = await treeResponse.json();
          throw new Error(error.message || '创建 tree 失败');
        }

        const treeData = await treeResponse.json();

        // 6. 创建新的 commit
        const newCommitUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/commits`;
        const newCommitResponse = await fetch(newCommitUrl, {
          method: 'POST',
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Rename ${oldFilename} to ${newFilename}`,
            tree: treeData.sha,
            parents: [latestCommitSha]
          })
        });

        if (!newCommitResponse.ok) {
          throw new Error('创建 commit 失败');
        }

        const newCommitData = await newCommitResponse.json();

        // 7. 更新分支引用
        const updateRefUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/refs/heads/${BRANCH}`;
        const updateRefResponse = await fetch(updateRefUrl, {
          method: 'PATCH',
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            sha: newCommitData.sha
          })
        });

        if (!updateRefResponse.ok) {
          throw new Error('更新分支引用失败');
        }

        // 成功提示
        alert(`文件已重命名为 "${newFilename}"`);

      } catch (error) {
        // 【回滚】恢复旧文件名
        files[index] = oldFilename;
        renderFileList();

        alert(`重命名失败: ${error.message}`);
      } finally {
        // 重新启用按钮
        document.querySelectorAll('.edit-btn, .delete-btn').forEach(btn => btn.disabled = false);
      }
    }

    // 获取文件的 SHA
    async function getFileSHA(filename) {
      const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${encodeURIComponent(filename)}`;

      console.log('请求 URL:', url);

      const response = await fetch(url, {
        headers: {
          'Authorization': `token ${githubToken}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });

      if (!response.ok) {
        let errorMsg = `HTTP ${response.status} ${response.statusText}`;
        try {
          const errorData = await response.json();
          if (errorData.message) {
            errorMsg += `: ${errorData.message}`;
          }
        } catch (e) {
          // 无法解析错误响应
        }
        throw new Error(`获取文件信息失败: ${errorMsg}`);
      }

      const data = await response.json();
      return data.sha;
    }

    // 删除文件
    async function deleteFile(filename) {
      if (!githubToken) {
        alert('请先配置 GitHub Token');
        return;
      }

      if (!confirm(`确定要删除 "${filename}" 吗？此操作不可撤销。`)) {
        return;
      }

      try {
        // 禁用所有删除按钮
        document.querySelectorAll('.delete-btn').forEach(btn => btn.disabled = true);

        // 获取文件 SHA
        const sha = await getFileSHA(filename);

        // 删除文件
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${encodeURIComponent(filename)}`;
        const response = await fetch(url, {
          method: 'DELETE',
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Delete ${filename}`,
            sha: sha,
            branch: BRANCH
          })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message || '删除失败');
        }

        // 从文件列表中移除该文件
        const index = files.indexOf(filename);
        if (index > -1) {
          files.splice(index, 1);
        }

        // 重新渲染列表
        renderFileList();

        alert(`文件 "${filename}" 已删除。`);

      } catch (error) {
        alert(`删除失败: ${error.message}`);
        // 重新启用删除按钮
        document.querySelectorAll('.delete-btn').forEach(btn => btn.disabled = false);
      }
    }

    // 初始化页面
    renderFileList();

    // 从 GitHub API 获取最新的文件列表（异步更新）
    fetchActualFileList();
  </script>
</body>
</html>
