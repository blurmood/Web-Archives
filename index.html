<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEB ARCHIVES</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      --klein-blue: #002FA7;
      --black: #000000;
      --white: #FFFFFF;
      --gray-100: #F5F5F5;
      --gray-200: #E0E0E0;
      --gray-300: #BDBDBD;
      --gray-800: #424242;
      --grid-unit: 8px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--white);
      color: var(--black);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: calc(var(--grid-unit) * 10) calc(var(--grid-unit) * 4);
    }

    header {
      margin-bottom: calc(var(--grid-unit) * 12);
      border-bottom: 2px solid var(--black);
      padding-bottom: calc(var(--grid-unit) * 4);
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--black);
      margin-bottom: calc(var(--grid-unit) * 2);
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--gray-800);
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .config-toggle {
      margin-bottom: calc(var(--grid-unit) * 3);
    }

    .btn-toggle {
      padding: calc(var(--grid-unit) * 2) calc(var(--grid-unit) * 3);
      background: var(--white);
      color: var(--black);
      border: 2px solid var(--black);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: calc(var(--grid-unit) * 1);
    }

    .btn-toggle:hover {
      background: var(--gray-100);
    }

    #toggle-icon {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1;
      transition: transform 0.2s ease;
    }

    .config-section {
      background: var(--gray-100);
      border: 2px solid var(--black);
      padding: calc(var(--grid-unit) * 4);
      margin-bottom: calc(var(--grid-unit) * 10);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .config-section.collapsed {
      max-height: 0;
      padding: 0;
      border-width: 0;
      margin-bottom: calc(var(--grid-unit) * 3);
    }

    .config-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--black);
      margin-bottom: calc(var(--grid-unit) * 2);
      display: block;
    }

    .help-text {
      font-size: 0.75rem;
      color: var(--gray-800);
      margin-top: calc(var(--grid-unit) * 1);
      line-height: 1.4;
    }

    .help-text a {
      color: var(--klein-blue);
      text-decoration: none;
    }

    .help-text a:hover {
      text-decoration: underline;
    }

    .config-section input {
      width: 100%;
      padding: calc(var(--grid-unit) * 2);
      margin-top: calc(var(--grid-unit) * 2);
      border: 2px solid var(--black);
      background: var(--white);
      font-family: 'Courier New', monospace;
      font-size: 0.875rem;
      color: var(--black);
    }

    .config-section input:focus {
      outline: none;
      border-color: var(--klein-blue);
    }

    .button-row {
      display: flex;
      align-items: center;
      gap: calc(var(--grid-unit) * 2);
      margin-top: calc(var(--grid-unit) * 3);
    }

    .btn {
      padding: calc(var(--grid-unit) * 2) calc(var(--grid-unit) * 4);
      background: var(--klein-blue);
      color: var(--white);
      border: none;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn:hover {
      background: #0025CC;
    }

    .btn:active {
      background: #001A80;
    }

    .status {
      font-size: 0.75rem;
      color: var(--gray-800);
      display: none;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .status.success {
      color: var(--klein-blue);
      display: block;
    }

    .status.error {
      color: #D32F2F;
      display: block;
    }

    .archives-list {
      list-style: none;
      border: 2px solid var(--black);
    }

    .file-item {
      border-bottom: 1px solid var(--gray-200);
      background: var(--white);
      transition: background 0.1s ease;
    }

    .file-item:last-child {
      border-bottom: none;
    }

    .file-item:hover {
      background: var(--gray-100);
    }

    .file-header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: calc(var(--grid-unit) * 3);
      padding: calc(var(--grid-unit) * 3) calc(var(--grid-unit) * 4);
    }

    .file-link {
      text-decoration: none;
      color: var(--black);
      font-size: 1rem;
      font-weight: 400;
      cursor: pointer;
      transition: color 0.1s ease;
    }

    .file-link:hover {
      color: var(--klein-blue);
    }

    .file-actions {
      display: flex;
      gap: calc(var(--grid-unit) * 1);
    }

    .btn-ghost {
      padding: calc(var(--grid-unit) * 1) calc(var(--grid-unit) * 2);
      background: transparent;
      color: var(--black);
      border: 1px solid var(--black);
      font-family: inherit;
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .btn-ghost:hover {
      background: var(--black);
      color: var(--white);
    }

    .btn-ghost:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-ghost:disabled:hover {
      background: transparent;
      color: var(--black);
    }

    .btn-ghost.danger:hover:not(:disabled) {
      background: #D32F2F;
      border-color: #D32F2F;
      color: var(--white);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--white);
      border: 4px solid var(--black);
      width: 90%;
      max-width: 1400px;
      height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: calc(var(--grid-unit) * 3) calc(var(--grid-unit) * 4);
      border-bottom: 2px solid var(--black);
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: calc(var(--grid-unit) * 3);
      background: var(--gray-100);
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--black);
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .modal-close {
      background: var(--black);
      border: none;
      color: var(--white);
      cursor: pointer;
      padding: 0;
      width: calc(var(--grid-unit) * 5);
      height: calc(var(--grid-unit) * 5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      transition: background 0.1s ease;
    }

    .modal-close:hover {
      background: var(--klein-blue);
    }

    .modal-body {
      flex: 1;
      overflow: hidden;
    }

    .preview-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--white);
    }

    @media (max-width: 768px) {
      .container {
        padding: calc(var(--grid-unit) * 6) calc(var(--grid-unit) * 3);
      }

      h1 {
        font-size: 2rem;
      }

      .file-header {
        grid-template-columns: 1fr;
        gap: calc(var(--grid-unit) * 2);
      }

      .file-actions {
        justify-content: flex-start;
      }

      .modal-content {
        width: 95%;
        height: 95vh;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Web Archives</h1>
      <div class="subtitle">Collection System</div>
    </header>

    <div class="config-toggle">
      <button class="btn-toggle" onclick="toggleConfig()">
        <span id="toggle-icon">+</span> Configure GitHub Token
      </button>
    </div>

    <div class="config-section" id="config-section" style="display: none;">
      <label class="config-label" for="github-token">
        GitHub Access Token
      </label>
      <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx">
      <div class="help-text">
        Requires <code>repo</code> scope. <a href="https://github.com/settings/tokens/new?scopes=repo&description=Web-Archives-Manager" target="_blank">Create Token</a>
      </div>
      <div class="button-row">
        <button class="btn" onclick="saveToken()">Save</button>
        <div id="token-status" class="status"></div>
      </div>
    </div>

    <ul class="archives-list" id="file-list">
      <!-- File list generated by JavaScript -->
    </ul>
  </div>

  <!-- 预览模态框 -->
  <div id="preview-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">预览</h2>
        <button class="modal-close" onclick="closePreview()">&times;</button>
      </div>
      <div class="modal-body">
        <iframe id="preview-frame" class="preview-frame"></iframe>
      </div>
    </div>
  </div>

  <script>
    // GitHub 仓库配置
    const REPO_OWNER = 'blurmood';
    const REPO_NAME = 'Web-Archives';
    const BRANCH = 'main';

    // 从 localStorage 加载 token
    let githubToken = localStorage.getItem('github_token') || '';
    if (githubToken) {
      document.getElementById('github-token').value = githubToken;
      showStatus('token-status', 'Token Loaded', 'success');
    }

    // 切换配置区域显示/隐藏
    function toggleConfig() {
      const section = document.getElementById('config-section');
      const icon = document.getElementById('toggle-icon');

      if (section.style.display === 'none') {
        section.style.display = 'block';
        icon.textContent = '−';
      } else {
        section.style.display = 'none';
        icon.textContent = '+';
      }
    }

    // 文件列表数据（由 GitHub Actions 生成时填充）
    let files = [
      "X 上的 Miles.：“Discord搞钱指南：中国人怎么在英文社区赚美金” _ X (2026_5_24 19：00：56).html", "研究发现：吃个饭的隔夜饭，反而更健康？ - 今日头条 (2026_5_24 16：52：59).html"
    ];

    // 从 GitHub API 获取实际的文件列表
    async function fetchActualFileList() {
      try {
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`;
        const response = await fetch(url, {
          headers: {
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!response.ok) {
          console.warn('无法获取文件列表，使用 HTML 中的数据');
          return;
        }

        const data = await response.json();
        const htmlFiles = data
          .filter(item => item.type === 'file' && item.name.endsWith('.html'))
          .filter(item => item.name !== 'index.html' && item.name !== 'index-template.html')
          .map(item => item.name);

        if (htmlFiles.length > 0) {
          files = htmlFiles;
          renderFileList();
          console.log('文件列表已从 GitHub API 同步');
        }
      } catch (error) {
        console.warn('获取文件列表失败，使用 HTML 中的数据:', error);
      }
    }

    // 保存 Token
    function saveToken() {
      const token = document.getElementById('github-token').value.trim();
      if (!token) {
        showStatus('token-status', 'Invalid Token', 'error');
        return;
      }
      localStorage.setItem('github_token', token);
      githubToken = token;
      showStatus('token-status', 'Token Saved', 'success');

      // 重新渲染列表以启用按钮
      renderFileList();
    }

    // 显示状态消息
    function showStatus(elementId, message, type) {
      const statusEl = document.getElementById(elementId);
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
      setTimeout(() => {
        statusEl.style.display = 'none';
      }, 3000);
    }

    // 渲染文件列表
    function renderFileList() {
      const listEl = document.getElementById('file-list');
      listEl.innerHTML = files.map((filename, index) => `
        <li class="file-item">
          <div class="file-header">
            <a class="file-link" onclick="openPreview('${filename}')" id="link-${index}">${filename}</a>
            <div class="file-actions">
              <button class="btn-ghost" onclick="window.open('${filename}', '_blank')">
                View
              </button>
              <button class="btn-ghost" onclick="editFilename(${index}, '${filename}')" ${!githubToken ? 'disabled' : ''}>
                Edit
              </button>
              <button class="btn-ghost danger" onclick="deleteFile('${filename}')" ${!githubToken ? 'disabled' : ''}>
                Delete
              </button>
            </div>
          </div>
        </li>
      `).join('');
    }

    // 打开预览模态框
    function openPreview(filename) {
      const modal = document.getElementById('preview-modal');
      const frame = document.getElementById('preview-frame');
      const title = document.getElementById('modal-title');

      title.textContent = filename;
      frame.src = filename;
      modal.classList.add('active');

      // 点击模态框背景关闭
      modal.onclick = function(e) {
        if (e.target === modal) {
          closePreview();
        }
      };
    }

    // 关闭预览模态框
    function closePreview() {
      const modal = document.getElementById('preview-modal');
      modal.classList.remove('active');
    }

    // ESC 键关闭模态框
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closePreview();
      }
    });

    // 编辑文件名（使用 Git Tree API 在单个 commit 中完成重命名）
    async function editFilename(index, oldFilename) {
      if (!githubToken) {
        alert('请先配置 GitHub Token');
        return;
      }

      const newFilename = prompt('输入新的文件名:', oldFilename);

      if (!newFilename || newFilename === oldFilename) {
        return;
      }

      if (!newFilename.endsWith('.html')) {
        alert('文件名必须以 .html 结尾');
        return;
      }

      // 【乐观更新】立即更新前端显示
      files[index] = newFilename;
      renderFileList();

      try {
        // 禁用所有按钮
        document.querySelectorAll('.edit-btn, .delete-btn').forEach(btn => btn.disabled = true);

        // 1. 获取当前分支的最新 commit
        const refUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/refs/heads/${BRANCH}`;
        const refResponse = await fetch(refUrl, {
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!refResponse.ok) {
          throw new Error('获取分支信息失败');
        }

        const refData = await refResponse.json();
        const latestCommitSha = refData.object.sha;

        // 2. 获取文件内容
        const fileUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${encodeURIComponent(oldFilename)}`;
        const fileResponse = await fetch(fileUrl, {
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!fileResponse.ok) {
          throw new Error('获取文件内容失败');
        }

        const fileData = await fileResponse.json();

        // 3. 创建新的 blob（使用旧文件的内容）
        const blobUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/blobs`;
        const blobResponse = await fetch(blobUrl, {
          method: 'POST',
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            content: fileData.content,
            encoding: 'base64'
          })
        });

        if (!blobResponse.ok) {
          throw new Error('创建 blob 失败');
        }

        const blobData = await blobResponse.json();

        // 4. 获取当前 commit 的 tree
        const commitUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/commits/${latestCommitSha}`;
        const commitResponse = await fetch(commitUrl, {
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (!commitResponse.ok) {
          throw new Error('获取 commit 信息失败');
        }

        const commitData = await commitResponse.json();
        const baseTreeSha = commitData.tree.sha;

        // 5. 创建新的 tree（删除旧文件，添加新文件）
        const treeUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees`;
        const treeResponse = await fetch(treeUrl, {
          method: 'POST',
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            base_tree: baseTreeSha,
            tree: [
              {
                path: oldFilename,
                mode: '100644',
                type: 'blob',
                sha: null  // null 表示删除
              },
              {
                path: newFilename,
                mode: '100644',
                type: 'blob',
                sha: blobData.sha
              }
            ]
          })
        });

        if (!treeResponse.ok) {
          const error = await treeResponse.json();
          throw new Error(error.message || '创建 tree 失败');
        }

        const treeData = await treeResponse.json();

        // 6. 创建新的 commit
        const newCommitUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/commits`;
        const newCommitResponse = await fetch(newCommitUrl, {
          method: 'POST',
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Rename ${oldFilename} to ${newFilename}`,
            tree: treeData.sha,
            parents: [latestCommitSha]
          })
        });

        if (!newCommitResponse.ok) {
          throw new Error('创建 commit 失败');
        }

        const newCommitData = await newCommitResponse.json();

        // 7. 更新分支引用
        const updateRefUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/refs/heads/${BRANCH}`;
        const updateRefResponse = await fetch(updateRefUrl, {
          method: 'PATCH',
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            sha: newCommitData.sha
          })
        });

        if (!updateRefResponse.ok) {
          throw new Error('更新分支引用失败');
        }

        // 成功提示
        alert(`文件已重命名为 "${newFilename}"`);

      } catch (error) {
        // 【回滚】恢复旧文件名
        files[index] = oldFilename;
        renderFileList();

        alert(`重命名失败: ${error.message}`);
      } finally {
        // 重新启用按钮
        document.querySelectorAll('.edit-btn, .delete-btn').forEach(btn => btn.disabled = false);
      }
    }

    // 获取文件的 SHA
    async function getFileSHA(filename) {
      const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${encodeURIComponent(filename)}`;

      console.log('请求 URL:', url);

      const response = await fetch(url, {
        headers: {
          'Authorization': `token ${githubToken}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });

      if (!response.ok) {
        let errorMsg = `HTTP ${response.status} ${response.statusText}`;
        try {
          const errorData = await response.json();
          if (errorData.message) {
            errorMsg += `: ${errorData.message}`;
          }
        } catch (e) {
          // 无法解析错误响应
        }
        throw new Error(`获取文件信息失败: ${errorMsg}`);
      }

      const data = await response.json();
      return data.sha;
    }

    // 删除文件
    async function deleteFile(filename) {
      if (!githubToken) {
        alert('请先配置 GitHub Token');
        return;
      }

      if (!confirm(`确定要删除 "${filename}" 吗？此操作不可撤销。`)) {
        return;
      }

      try {
        // 禁用所有删除按钮
        document.querySelectorAll('.delete-btn').forEach(btn => btn.disabled = true);

        // 获取文件 SHA
        const sha = await getFileSHA(filename);

        // 删除文件
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${encodeURIComponent(filename)}`;
        const response = await fetch(url, {
          method: 'DELETE',
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Delete ${filename}`,
            sha: sha,
            branch: BRANCH
          })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message || '删除失败');
        }

        // 从文件列表中移除该文件
        const index = files.indexOf(filename);
        if (index > -1) {
          files.splice(index, 1);
        }

        // 重新渲染列表
        renderFileList();

        alert(`文件 "${filename}" 已删除。`);

      } catch (error) {
        alert(`删除失败: ${error.message}`);
        // 重新启用删除按钮
        document.querySelectorAll('.delete-btn').forEach(btn => btn.disabled = false);
      }
    }

    // 初始化页面
    renderFileList();

    // 从 GitHub API 获取最新的文件列表（异步更新）
