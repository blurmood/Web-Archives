<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章列表</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 {
      font-size: 1.5em;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }
    .config-section {
      background: #f6f8fa;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
    }
    .config-section input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #d0d7de;
      border-radius: 4px;
      font-family: monospace;
    }
    .config-section button {
      margin-top: 10px;
      padding: 8px 16px;
      background: #2da44e;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .config-section button:hover {
      background: #2c974b;
    }
    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      display: none;
    }
    .status.success {
      background: #dafbe1;
      color: #1a7f37;
      display: block;
    }
    .status.error {
      background: #ffebe9;
      color: #cf222e;
      display: block;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      margin: 12px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    a {
      text-decoration: none;
      color: #0969da;
      font-size: 1.1em;
      flex: 1;
    }
    a:hover {
      text-decoration: underline;
    }
    .delete-btn {
      padding: 4px 12px;
      background: #cf222e;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
    }
    .delete-btn:hover {
      background: #a40e26;
    }
    .delete-btn:disabled {
      background: #6e7781;
      cursor: not-allowed;
    }
    .help-text {
      font-size: 0.9em;
      color: #57606a;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h1>📄 文章列表</h1>

  <div class="config-section">
    <label for="github-token">
      <strong>GitHub Personal Access Token</strong>
      <div class="help-text">
        需要 <code>repo</code> 权限。创建 Token:
        <a href="https://github.com/settings/tokens/new?scopes=repo&description=Web-Archives-Manager" target="_blank">点击这里</a>
      </div>
    </label>
    <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx">
    <button onclick="saveToken()">保存 Token</button>
    <div id="token-status" class="status"></div>
  </div>

  <ul id="file-list">
    <!-- 文件列表将由 JavaScript 生成 -->
  </ul>

  <script>
    // GitHub 仓库配置
    const REPO_OWNER = 'blurmood';
    const REPO_NAME = 'Web-Archives';
    const BRANCH = 'main';

    // 从 localStorage 加载 token
    let githubToken = localStorage.getItem('github_token') || '';
    if (githubToken) {
      document.getElementById('github-token').value = githubToken;
      showStatus('token-status', 'Token 已加载', 'success');
    }

    // 文件列表数据（由 GitHub Actions 生成时填充）
    const files = [
      "研究发现：吃隔夜饭，反而更健康？ - 今日头条 (2026_5_24 16：52：59).html"
    ];

    // 保存 Token
    function saveToken() {
      const token = document.getElementById('github-token').value.trim();
      if (!token) {
        showStatus('token-status', '请输入有效的 Token', 'error');
        return;
      }
      localStorage.setItem('github_token', token);
      githubToken = token;
      showStatus('token-status', 'Token 已保存', 'success');
    }

    // 显示状态消息
    function showStatus(elementId, message, type) {
      const statusEl = document.getElementById(elementId);
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
      setTimeout(() => {
        statusEl.style.display = 'none';
      }, 3000);
    }

    // 渲染文件列表
    function renderFileList() {
      const listEl = document.getElementById('file-list');
      listEl.innerHTML = files.map(filename => `
        <li>
          <a href="${filename}">${filename}</a>
          <button class="delete-btn" onclick="deleteFile('${filename}')" ${!githubToken ? 'disabled' : ''}>
            删除
          </button>
        </li>
      `).join('');
    }

    // 获取文件的 SHA
    async function getFileSHA(filename) {
      const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${encodeURIComponent(filename)}`;

      console.log('请求 URL:', url);

      const response = await fetch(url, {
        headers: {
          'Authorization': `token ${githubToken}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });

      if (!response.ok) {
        let errorMsg = `HTTP ${response.status} ${response.statusText}`;
        try {
          const errorData = await response.json();
          if (errorData.message) {
            errorMsg += `: ${errorData.message}`;
          }
        } catch (e) {
          // 无法解析错误响应
        }
        throw new Error(`获取文件信息失败: ${errorMsg}`);
      }

      const data = await response.json();
      return data.sha;
    }

    // 删除文件
    async function deleteFile(filename) {
      if (!githubToken) {
        alert('请先配置 GitHub Token');
        return;
      }

      if (!confirm(`确定要删除 "${filename}" 吗？此操作不可撤销。`)) {
        return;
      }

      try {
        // 禁用所有删除按钮
        document.querySelectorAll('.delete-btn').forEach(btn => btn.disabled = true);

        // 获取文件 SHA
        const sha = await getFileSHA(filename);

        // 删除文件
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${encodeURIComponent(filename)}`;
        const response = await fetch(url, {
          method: 'DELETE',
          headers: {
            'Authorization': `token ${githubToken}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `Delete ${filename}`,
            sha: sha,
            branch: BRANCH
          })
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.message || '删除失败');
        }

        // 从文件列表中移除该文件
        const index = files.indexOf(filename);
        if (index > -1) {
          files.splice(index, 1);
        }

        // 重新渲染列表
        renderFileList();

        alert(`文件 "${filename}" 已删除。`);

      } catch (error) {
        alert(`删除失败: ${error.message}`);
        // 重新启用删除按钮
        document.querySelectorAll('.delete-btn').forEach(btn => btn.disabled = false);
      }
    }

    // 初始化页面
    renderFileList();
  </script>
</body>
</html>
